name: Code Coverage Report

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install
        working-directory: bookshop


      - name: Run tests and generate coverage
        run: npm test
        working-directory: bookshop
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: bookshop/coverage/coverage-summary.json
          archive: false

      - name: Upload code coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: bookshop/coverage/cobertura
          language: JavaScript
          label: Cobertura Coverage Report

  coverage-comment:
    name: Coverage Comment in PR
    runs-on: ubuntu-latest
    needs: run-tests
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-report

      - name: Create or update PR comment
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          SUMMARY: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}#summary-${{ job.check_run_id }}"
        run: |
          marker="<!-- coverage-summary -->"



          bodyFile="$(mktemp)"

          cat > "$bodyFile" <<EOF
          $marker

          # Coverage summary
          
          | Metric | Coverage | Threshold | Result |
          |--------|----------|-----------|--------|
          | Lines  | 85%      | 89%       | ✅     |
          | Branches| 80%     | 75%       | ✅     |
          | Functions| 90%     | 85%       | ✅     |
          | Statements| 88%     | 80%       | ✅     |
          
          ## Summary
          For a more detailed report click [here]($SUMMARY)

          _updated on workflow run: ${GITHUB_RUN_ID}_
          EOF

          commentID="$(
            gh api \
              -X GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq "map(select(.body | contains(\"$marker\"))) | .[0].id"
          )"

          if [[ -n "$commentID" && "$commentID" != "null" ]]; then
            echo "Updating existing comment ID: $commentID"
            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/issues/comments/$commentID" \
              -f body="$(cat "$bodyFile")"
          else
            echo "Creating new comment"
            gh api \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$bodyFile")"
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Coverage Report
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Coverage Report

          | Metric | Coverage | Threshold | Result |
          |--------|----------|-----------|--------|
          | Lines  | 85%      | 80%       | ✅     |
          | Branches| 80%     | 75%       | ✅     |
          | Functions| 90%     | 85%       | ✅     |
          | Statements| 88%     | 80%       | ✅     |

          ## Notes

          This is a placeholder report

          ## Link tests
          [srv/cat-service.cds](https://github.com/$REPO/blob/$SHA/bookshop/srv/cat-service.cds#L3) | 0% |
          EOF
