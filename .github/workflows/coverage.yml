name: Code Coverage Report

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Coverage Report
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"

          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Coverage Report

          | Metric | Coverage | Threshold | Result |
          |--------|----------|-----------|--------|
          | Lines  | 85%      | 80%       | ✅     |
          | Branches| 80%     | 75%       | ✅     |
          | Functions| 90%     | 85%       | ✅     |
          | Statements| 88%     | 80%       | ✅     |

          ## Notes

          This is a placeholder report

          ## Link tests
          [srv/cat-service.cds](https://github.com/$REPO/blob/$SHA/srv/cat-service.cds#L3) | 0% |
          EOF
